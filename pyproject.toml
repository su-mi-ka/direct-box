[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "direct-box"
version = "0.1.0"
description = "A letter box where agents (seats) deliver messages to each other by name, gated by a genealogy of ranks, with an append-only ledger that also records what was not delivered."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["direct_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
